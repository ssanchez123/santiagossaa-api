services:
  api:
    image: santiago-api
    build: .
    container_name: santiago-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
    networks:
      - internal
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ENV=development

networks:
  internal:
    driver: bridge